[project]
name = "novel-orchestrator"
version = "0.1.0"
description = "Local, resumable multi-agent orchestration for long-form Chinese fiction."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.15.0",
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "jinja2>=3.1.5",
  "openai>=1.93.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.9.0",
  "python-dotenv>=1.1.0",
  "python-multipart>=0.0.20",
  "rapidfuzz>=3.13.0",
  "sqlalchemy>=2.0.40",
  "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.0.0",
  "ruff>=0.12.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
